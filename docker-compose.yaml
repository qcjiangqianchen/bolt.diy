services:
  db:
    image: postgres:17-alpine
    container_name: bolt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bolt_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bolt_local_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-bolt_core}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bolt_app} -d ${POSTGRES_DB:-bolt_core}']
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - development
      - production
      - default

  app-prod:
    image: bolt-ai:production
    build:
      context: .
      dockerfile: Dockerfile
      target: bolt-ai-production
    ports:
      - '5173:5173'
    env_file: 
      - '.env'
      - '.env.local'
    environment:
      - NODE_ENV=production
      - COMPOSE_PROFILES=production
      - FLYCTL_PATH=/usr/local/bin/flyctl
      - PATH=/usr/local/bin:/root/.fly/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - BOLT_AUTH_USER_STORE_FILE=/app/data/.bolt-auth-users.json
      # No strictly needed but serving as hints for Coolify
      - PORT=5173
      - VITE_LOG_LEVEL=${VITE_LOG_LEVEL:-debug}
      - DEFAULT_NUM_CTX=${DEFAULT_NUM_CTX:-32768}
      - RUNNING_IN_DOCKER=true
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - auth-data:/app/data
    command: pnpm run dockerstart:node
    profiles:
      - production

  app-dev:
    image: bolt-ai:development
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    env_file: 
      - '.env'
      - '.env.local'
    environment:
      - NODE_ENV=development
      - FLYCTL_PATH=/usr/local/bin/flyctl
      - PATH=/usr/local/bin:/root/.fly/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - VITE_HMR_PROTOCOL=ws
      - VITE_HMR_HOST=localhost
      - VITE_HMR_PORT=5173
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - PORT=5173
      - VITE_LOG_LEVEL=${VITE_LOG_LEVEL:-debug}
      - DEFAULT_NUM_CTX=${DEFAULT_NUM_CTX:-32768}
      - RUNNING_IN_DOCKER=true
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - type: bind
        source: .
        target: /app
        consistency: cached
      - /app/node_modules
    ports:
      - '5173:5173'
    command: pnpm run dev --host 0.0.0.0
    profiles: ['development', 'default']

  app-prebuild:
    image: ghcr.io/stackblitz-labs/bolt.diy:latest
    ports:
      - '5173:5173'
    environment:
      - NODE_ENV=production
      - COMPOSE_PROFILES=production
      - FLYCTL_PATH=/usr/local/bin/flyctl
      - PATH=/usr/local/bin:/root/.fly/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - BOLT_AUTH_USER_STORE_FILE=/app/data/.bolt-auth-users.json
      # No strictly needed but serving as hints for Coolify
      - PORT=5173
      - OLLAMA_API_BASE_URL=http://127.0.0.1:11434
      - DEFAULT_NUM_CTX=${DEFAULT_NUM_CTX:-32768}
      - RUNNING_IN_DOCKER=true
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - auth-data:/app/data
    command: pnpm run dockerstart:node
    profiles:
      - prebuilt

volumes:
  auth-data:
  postgres-data:
